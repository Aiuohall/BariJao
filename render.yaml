# Render Blueprint for BariJao. See https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then on Render -> New -> Blueprint, pick this repo.
services:
  - type: web
    name: barijao
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Signs login tokens. Render generates a random value on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Email delivery for OTP codes. Set these in the Render dashboard.
      #
      # RECOMMENDED: Brevo. Render's free plan blocks outbound SMTP, so Gmail/SMTP
      # will NOT deliver mail here — Brevo sends over HTTPS and does work.
      #   BREVO_API_KEY = API key from Brevo -> SMTP & API -> API Keys
      #   EMAIL_FROM    = BariJao <a-sender-verified-in-brevo@example.com>
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        sync: false
      # Fallback only (blocked on Render free):
      #   SMTP_USER = your Gmail address
      #   SMTP_PASS = a Google "App Password" (not your normal password)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional: enables the AI "generate description" feature. Set in dashboard.
      - key: VITE_GOOGLE_AI_API_KEY
        sync: false
      # Optional: switch from local SQLite to Supabase by setting these in the dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
